name: Test and publish image

# develop 和面向 main 的 PR 只测试；main 推送后额外发布镜像。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支有新提交时取消旧任务，避免浪费构建资源。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # canvas 测试需要系统绘图库和中文字体。
      - name: Install dependencies and run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 make g++ pkg-config libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev fonts-noto-cjk fontconfig
          npm ci
          npm test

  publish:
    needs: test
    # 测试成功且事件是 main 推送时才发布；PR 不获得发布权限。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # 不上传额外的构建记录文件，减少 Actions 存储占用。
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # 使用 GitHub 自动提供的令牌，无需配置个人 Token。
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 一次构建直接发布；latest 用于更新，提交号标签用于固定版本。
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cuituesday/mojian:latest
            ghcr.io/cuituesday/mojian:sha-${{ github.sha }}
          # 将镜像关联到源码仓库，便于追溯版本。
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 复用 Docker 构建层，减少后续重复安装依赖的时间。
          cache-from: type=gha,scope=mojian-amd64
          cache-to: type=gha,scope=mojian-amd64,mode=min
