services:
  mojian:
    # 服务器直接拉取 main 分支发布的镜像；本地开发仍使用 npm start。
    image: ghcr.io/cuituesday/mojian:latest
    init: true
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # 持久化业务数据，更新容器时继续复用此卷。
      - ink-data:/app/data
      # 清理策略等配置由服务器提供，容器内只读。
      - ./config.json:/app/config.json:ro
    stop_grace_period: 15s
    logging:
      # 限制 Docker 标准输出日志大小，独立于应用日志保留天数。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ink-data:
